<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Kontak | SMP Plus Ibadurrahman</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #0d6efd; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: Arial, sans-serif; }
        textarea { resize: vertical; }
        button { background: #0d6efd; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0b4fb0; }
        .success { color: #28a745; margin-top: 10px; }
        .error { color: #dc3545; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hubungi SMP Plus Ibadurrahman</h1>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Nama Lengkap *</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Nomor Telepon</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <div class="form-group">
                <label for="subject">Subjek *</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <div class="form-group">
                <label for="message">Pesan *</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit">Kirim Pesan</button>
            <div id="responseMessage"></div>
        </form>
    </div>

    <script>
        // Menggunakan Formspree atau Basin untuk handling form
        // Ganti dengan endpoint Anda sendiri
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(document.getElementById('contactForm'));
            const data = Object.fromEntries(formData);
            
            // Contoh: Kirim ke email via Formspree
            // Daftar di https://formspree.io dan dapatkan endpoint
            
            const messageDiv = document.getElementById('responseMessage');
            messageDiv.innerHTML = '<p class="success">Terima kasih! Pesan Anda telah dikirim.</p>';
            document.getElementById('contactForm').reset();
            
            // Jika ingin implementasi lebih lanjut, gunakan:
            // const response = await fetch('https://formspree.io/f/YOUR_FORM_ID', {
            //     method: 'POST',
            //     body: formData
            // });
        });
    </script>
</body>
</html>
